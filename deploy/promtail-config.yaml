server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: ad-manager
          env: local
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            event: event
            timestamp: timestamp
