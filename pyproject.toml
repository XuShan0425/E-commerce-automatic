[project]
name = "aliexpress-ad-manager"
version = "0.1.0"
description = "速卖通广告智能管理系统"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "N999"]
"**/__init__.py" = ["F401", "N999"]
"App/services/stealth.py" = ["E501"]
"App/services/decision_engine.py" = ["E501"]
"App/services/product_scraper.py" = ["E501"]
"App/services/email_notifier.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
